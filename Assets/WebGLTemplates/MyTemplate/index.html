<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | My project</title>

    <style>
      html,
      body {
        width: 100vw;
        height: 100vh;
        padding: 0;
        border: 0;
        margin: 0;
        overflow: hidden;
        background: #5C807D;
      }

      #loader {
        position: fixed;
        width: 100vw;
        height: 100vh;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: sans-serif;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #333;
        border-top: 5px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        100% { transform: rotate(360deg); }
      }

      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #5C807D;
      }
    </style>
  </head>

  <body>

    <!-- LOADER -->
    <div id="loader">
      <div class="spinner"></div>
      <div id="loading-text">Cargando... 0%</div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/BuildsJ40.loader.js"></script>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function resizeCanvasToViewport() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      resizeCanvasToViewport();
      window.addEventListener("resize", resizeCanvasToViewport);
      window.addEventListener("orientationchange", resizeCanvasToViewport);

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        canvas.style.position = "fixed";
        canvas.style.inset = "0";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(canvas, {
        dataUrl: "Build/BuildsJ40.data.gz",
        frameworkUrl: "Build/BuildsJ40.framework.js.gz",
        codeUrl: "Build/BuildsJ40.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My project",
        productVersion: "0.1",
      }, (progress) => {

        // PROGRESO REAL
        let percent = Math.round(progress * 100);
        document.getElementById("loading-text").innerText =
          "Cargando... " + percent + "%";

      }).then((unityInstance) => {

        // OCULTAR LOADER CUANDO TERMINA
        document.getElementById("loader").style.display = "none";

      });
    </script>

  </body>
</html>

<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | My project</title>

    <style>
      @font-face {
        font-family: "AvocadoTaco";
        src: url("TemplateData/fonts/aAvocadoTaco.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      @font-face {
        font-family: "Questrial";
        src: url("TemplateData/fonts/Questrial-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        padding: 0;
        border: 0;
        margin: 0;
        overflow: hidden;
        background: #9FDCD7;
      }

      #loader {
        position: fixed;
        width: 100vw;
        height: 100vh;
        padding: 28px;
        box-sizing: border-box;
        background: #9FDCD7;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: #f3f4f6;
        font-family: "Questrial", Arial, sans-serif;
        text-align: center;
      }

      .loader-brand {
        margin: 0 0 10px;
        color: #ffffff;
        font-family: "AvocadoTaco", "Century Gothic", CenturyGothic, AppleGothic, Arial, sans-serif;
        font-size: clamp(2.4rem, 9vw, 4.8rem);
        font-weight: normal;
        line-height: 0.95;
      }

      .loader-tagline {
        max-width: 420px;
        margin: 0 0 28px;
        color: #ffffff;
        font-size: clamp(0.95rem, 3vw, 1.1rem);
      }

      .loader-gif-wrap {
        position: relative;
        width: min(54vw, 240px);
        aspect-ratio: 1;
        margin-bottom: 28px;
        display: grid;
        place-items: center;
      }

      .loader-gif {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .loader-gif-fallback {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        border: 2px solid rgba(98, 197, 187, 0.55);
        border-radius: 50%;
        background: rgba(31, 35, 40, 0.5);
        color: #f3b562;
        font-size: clamp(3.4rem, 18vw, 6rem);
        font-weight: 700;
        line-height: 1;
      }

      .loader-gif.is-missing {
        display: none;
      }

      .loader-gif.is-missing + .loader-gif-fallback {
        display: grid;
      }

      .loading-progress {
        width: min(76vw, 420px);
      }

      #loading-text {
        margin-bottom: 12px;
        color: #f3f4f6;
        font-size: 1rem;
      }

      .progress-track {
        width: 100%;
        height: 14px;
        overflow: hidden;
        border: 2px solid #ffffff;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 4px 10px rgba(92, 128, 125, 0.18);
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: #9FDCD7;
        transition: width 0.2s ease;
      }

      .loader-note {
        margin: 14px 0 0;
        color: #ffffff;
        font-size: 0.82rem;
      }

      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #9FDCD7;
      }
    </style>
  </head>

  <body>

    <div id="loader">
      <h1 class="loader-brand">J4VI</h1>
      <p class="loader-tagline">Pon un Javi en tu vida</p>

      <div class="loader-gif-wrap" aria-hidden="true">
        <img
          id="loading-gif"
          class="loader-gif"
          src="TemplateData/wip.gif"
          alt=""
          onerror="this.classList.add('is-missing');"
        >
        <div class="loader-gif-fallback">J</div>
      </div>

      <div class="loading-progress" aria-live="polite">
        <div id="loading-text">Cargando... 0%</div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-fill"></div>
        </div>
        <p class="loader-note">Preparando tu mascota virtual</p>
      </div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script src="Build/BuildsJ40.loader.js"></script>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function resizeCanvasToViewport() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      resizeCanvasToViewport();
      window.addEventListener("resize", resizeCanvasToViewport);
      window.addEventListener("orientationchange", resizeCanvasToViewport);

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        canvas.style.position = "fixed";
        canvas.style.inset = "0";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(canvas, {
        dataUrl: "Build/BuildsJ40.data.gz",
        frameworkUrl: "Build/BuildsJ40.framework.js.gz",
        codeUrl: "Build/BuildsJ40.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "My project",
        productVersion: "0.1",
      }, (progress) => {

        let percent = Math.round(progress * 100);
        document.getElementById("loading-text").innerText = "Cargando... " + percent + "%";
        document.getElementById("progress-fill").style.width = percent + "%";

      }).then((unityInstance) => {

        document.getElementById("loader").style.display = "none";

      });
    </script>

  </body>
</html>
